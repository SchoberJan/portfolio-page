<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio von Jan Schober" />
    <title>Jan Schober – Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Zum Inhalt springen</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <a class="site-header__logo" href="#home" aria-label="Zur Startseite">
          JS<span class="site-header__logo-dot">.</span>
        </a>

        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
          aria-label="Menü öffnen"
        >
          <span class="nav-toggle__bar"></span>
          <span class="nav-toggle__bar"></span>
          <span class="nav-toggle__bar"></span>
        </button>

        <nav class="site-nav" id="site-nav" aria-label="Hauptnavigation">
          <ul class="site-nav__list">
            <li><a class="site-nav__link" href="#home">Home</a></li>
            <li><a class="site-nav__link" href="#about">Über mich</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="hero" id="home" aria-labelledby="hero-title">
        <div class="container hero__inner">
          <p class="eyebrow">Portfolio</p>
          <h1 class="hero__title" id="hero-title">
            Hallo, ich bin <span class="hero__highlight">Jan Schober</span>.
          </h1>
          <p class="hero__lead">
            Hier entsteht mein Portfolio. Weitere Inhalte folgen in Kürze.
          </p>
          <div class="hero__actions">
            <a class="button button--primary" href="#about">Mehr über mich</a>
          </div>
        </div>
      </section>

      <section class="section" id="about" aria-labelledby="about-title">
        <div class="container about">
          <div class="about__portrait" aria-hidden="true">
            <span class="about__initials">JS</span>
          </div>
          <div class="about__content">
            <p class="eyebrow">Über mich</p>
            <h2 class="section__title" id="about-title">Wer ich bin</h2>
            <p class="section__text">
              Dieser Abschnitt wird bald mit Inhalt gefüllt.
            </p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <p class="site-footer__copy">
          © <span data-current-year>2026</span> Jan Schober
        </p>
        <a class="site-footer__top" href="#home">Nach oben ↑</a>
      </div>
    </footer>
  </body>
</html>
