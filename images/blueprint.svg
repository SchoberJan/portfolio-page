<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" stroke="#c3ccd1" stroke-width="1" font-family="ui-monospace, Consolas, monospace" font-size="11">
  <defs>
    <pattern id="grid-fine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" stroke-opacity=".1" />
    </pattern>
    <pattern id="grid-bold" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" stroke-opacity=".2" />
    </pattern>
    <!-- Links bleibt das Blatt ruhig, damit der Text führt -->
    <linearGradient id="fade-gradient">
      <stop offset=".12" stop-color="#000" />
      <stop offset=".62" stop-color="#fff" />
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1000">
      <rect width="1600" height="1000" fill="url(#fade-gradient)" />
    </mask>
  </defs>

  <g mask="url(#fade)">
    <rect width="1600" height="1000" fill="url(#grid-fine)" stroke="none" />
    <rect width="1600" height="1000" fill="url(#grid-bold)" stroke="none" />

    <!-- Rad mit Felge und Bremsscheibe -->
    <g transform="translate(1270 270)">
      <circle r="400" stroke-opacity=".3" stroke-dasharray="14 5 2 5" />
      <circle r="330" stroke-opacity=".35" />
      <circle r="262" stroke-width="1.5" />
      <circle r="252" stroke-opacity=".6" />
      <circle r="240" stroke-opacity=".5" stroke-width="10" stroke-dasharray="2 9" />
      <circle r="222" stroke-opacity=".7" />
      <circle r="176" stroke-width="1.5" stroke="#27f4d2" stroke-opacity=".8" />
      <circle r="166" stroke-opacity=".6" />
      <circle r="150" stroke-opacity=".5" stroke-width="16" stroke-dasharray="1.5 6" />
      <circle r="132" stroke-opacity=".8" />
      <circle r="104" stroke-opacity=".5" stroke-width="9" stroke-dasharray="9 13" />
      <circle r="80" />
      <circle r="44" stroke-opacity=".8" />
      <circle r="18" stroke="#27f4d2" />
      <g id="wheel-spoke" stroke-opacity=".7">
        <path d="M44 -5L132 -13M44 5L132 13" />
        <circle cx="62" r="5" />
      </g>
      <use href="#wheel-spoke" transform="rotate(60)" />
      <use href="#wheel-spoke" transform="rotate(120)" />
      <use href="#wheel-spoke" transform="rotate(180)" />
      <use href="#wheel-spoke" transform="rotate(240)" />
      <use href="#wheel-spoke" transform="rotate(300)" />
      <path d="M-440 0H440M0 -340V440" stroke-opacity=".55" stroke-dasharray="20 5 3 5" />
      <path d="M-300 -300L300 300M-300 300L300 -300" stroke-opacity=".2" />
      <path d="M262 0H360M360 -8V8" stroke-opacity=".7" />
      <path d="M0 262V300H150" stroke-opacity=".7" />
      <text x="156" y="304" fill="#c3ccd1" stroke="none">Ø 720</text>
      <text x="300" y="-14" fill="#c3ccd1" stroke="none">A-A</text>
    </g>

    <!-- Motorschnitt -->
    <g transform="translate(650 30) scale(1.25)" stroke-opacity=".85">
      <path d="M160 -30V260" stroke-opacity=".5" stroke-dasharray="14 4 2 4" />
      <g transform="rotate(-45 160 165)">
        <g id="engine-bank">
          <rect x="136" y="30" width="48" height="100" />
          <rect x="126" y="18" width="68" height="12" />
          <rect x="141" y="84" width="38" height="28" rx="2" />
          <path d="M160 112V165M152 18V8H168V18M136 50H184M136 62H184" />
        </g>
      </g>
      <use href="#engine-bank" transform="rotate(45 160 165)" />
      <circle cx="160" cy="165" r="30" />
      <circle cx="160" cy="165" r="8" />
      <path d="M160 165L181 186M112 165V222H208V165" />
      <path d="M112 200H208" stroke-dasharray="6 5" />
      <path d="M40 240H280M40 233V247M280 233V247" stroke-opacity=".6" />
      <text x="136" y="256" fill="#c3ccd1" stroke="none" font-size="9">V6 1,6 l</text>
    </g>

    <!-- Auto in Draufsicht -->
    <g transform="translate(530 560)">
      <path d="M-40 200H1060" stroke-opacity=".55" stroke-dasharray="20 5 3 5" />
      <g id="car-half">
        <path stroke-width="1.5" d="M62 200C110 192 180 182 250 174L335 164C372 158 392 140 410 104C418 86 434 72 462 68L620 72C680 86 740 130 828 166L872 182L878 200" />
        <path stroke-dasharray="6 5" stroke-opacity=".7" d="M360 158C390 120 400 78 432 62L680 64L700 108" />
        <path d="M34 200V70Q34 62 44 62H92Q100 62 100 72V96L70 120L66 164L60 200" />
        <path stroke-opacity=".7" d="M44 72C60 110 60 150 52 200M58 72C76 110 78 150 68 200" />
        <rect x="148" y="45" width="118" height="52" rx="8" />
        <rect x="706" y="45" width="118" height="62" rx="8" />
        <path stroke-opacity=".5" d="M160 45V97M178 45V97M196 45V97M214 45V97M232 45V97M250 45V97M718 45V107M736 45V107M754 45V107M772 45V107M790 45V107M808 45V107" />
        <path stroke-opacity=".8" d="M186 97L292 168M240 97L300 166M720 107L760 128M800 107L790 146" />
        <path d="M890 200V112H956V200" />
        <path stroke-opacity=".8" d="M886 108H960M900 112V200M916 112V200M872 186L890 190" />
        <path d="M340 200V180C344 170 410 168 430 176C450 182 462 190 466 200" />
        <path stroke-opacity=".8" d="M335 182C360 158 440 158 462 176M470 178C520 162 640 158 700 168L820 186V200" />
        <circle stroke-opacity=".8" cx="510" cy="180" r="12" />
        <circle stroke-opacity=".8" cx="556" cy="178" r="12" />
        <circle stroke-opacity=".8" cx="602" cy="176" r="12" />
        <path stroke="#27f4d2" stroke-opacity=".7" stroke-dasharray="6 5" d="M100 196L330 180L452 112L620 104L796 170" />
      </g>
      <use href="#car-half" transform="matrix(1 0 0 -1 0 400)" />
      <path d="M296 200H335" />
      <circle cx="372" cy="200" r="12" />
      <circle cx="662" cy="200" r="18" />
      <ellipse cx="486" cy="200" rx="12" ry="8" />
      <circle cx="556" cy="200" r="86" stroke-dasharray="6 5" stroke-opacity=".7" />
      <path stroke-opacity=".7" d="M207 362V414M765 362V414M207 404H765M12 45V355M4 45H20M4 355H20" />
      <text x="470" y="398" fill="#c3ccd1" stroke="none">3400</text>
      <text x="22" y="40" fill="#c3ccd1" stroke="none">1900</text>
    </g>
  </g>
</svg>
